name: Release
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx jest
      - name: Install Android platform, build-tools and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      # The token is bundled into the .snplg: the release is for the owner only, so the repo must stay private.
      - name: Build
        env:
          HARDCOVER_KEY: ${{ secrets.HARDCOVER_KEY }}
        run: |
          node scripts/write-token.js
          bash buildPlugin.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .versionName PluginConfig.json)-$(jq -r .versionCode PluginConfig.json)"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released (bump versionCode)"; exit 0; fi
          gh release create "$tag" build/outputs/HardcoverSync.snplg --target "$GITHUB_SHA" --generate-notes
